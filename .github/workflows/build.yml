name: Build ASI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Configure
      run: cmake -B build -A Win32

    - name: Build
      run: cmake --build build --config Release

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: MNZPanel-asi
        path: build/Release/MNZPanel.asi
